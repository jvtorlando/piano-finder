{# Ícone do tipo de piano (desenhos preenchidos da primeira versão do site). Uso: {% include "pianos/partials/tipo_icone.html" with tipo=piano.tipo classe="size-5" %} #}
<svg viewBox="0 0 16 16" class="{{ classe|default:'size-5' }} shrink-0" fill="currentColor" aria-hidden="true">

{% elif tipo == 'digital' %}

{% else %}
    <rect x="2" y="2" width="12" height="9" rx="1"/><rect x="3" y="11" width="10" height="1.5"/><rect x="3" y="13" width="1.5" height="2" rx="0.3"/><rect x="11.5" y="13" width="1.5" height="2" rx="0.3"/><rect x="3.5" y="3" width="1" height="5" rx="0.2" fill="#0d0d0d"/><rect x="5.5" y="3" width="1" height="5" rx="0.2" fill="#0d0d0d"/><rect x="7.5" y="3" width="1" height="5" rx="0.2" fill="#0d0d0d"/><rect x="9.5" y="3" width="1" height="5" rx="0.2" fill="#0d0d0d"/>
