{# Ícone do tipo de piano, em traço fino. Uso: {% include "pianos/partials/tipo_icone.html" with tipo=piano.tipo classe="size-5" %} #}

{% if tipo == 'cauda' %}
    {# Piano de cauda de perfil, tampa aberta apoiada na vareta. #}
    <path d="M2.5 12h19v2.6h-19z"/>
    <path d="M5.5 12 20.5 5.2"/>
    <path d="M14.5 12V8.1"/>

{% elif tipo == 'armario' %}

    <path d="M4 2.5h16v9H4z"/>
    <path d="M7 8.2h10"/>

    <path d="M10.1 20.2h.8M11.6 20.2h.8M13.1 20.2h.8" stroke-width="1"/>

    <path d="M10.5 8.9h3"/>

{% elif tipo == 'hibrido' %}

    <path d="M4 2.5h16v9H4z"/>
